<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registartion Form</h1>
    <label for="roll">Roll no.:</label>
    <input type="text" id="roll"> <br>

    <label for="ime">Students name: </label>
    <input type="text" id="ime" placeholder="First name">
    <input type="text" id="ime" placeholder="Last name"> <br>

    <label for="date">Date of birth: </label>
    <input type="date" id="date"> <br>

    <label for="tel">Mobile no.: </label>
    <input type="tel" name="tel" id="tel"> <br>

    <label for="email">Email ad.: </label>
    <input type="email" name="email" id="email"> <br>

    <label for="pass">Password: </label>
    <input type="password" name="pass" id="pass"> <br>

    <label for="">Gender: </label>
    <input type="radio" name="spol" id="M">
    <label for="M">Male</label>
    <input type="radio" name="spol" id="Ž">
    <label for="Ž">Female</label> <br>

    <label for="">Department: </label>
    <input type="checkbox" name="cse" id="cse">
    <label for="cse">CSE</label>
    <input type="checkbox" name="it" id="it">
    <label for="it">IT</label>
    <input type="checkbox" name="ece" id="ece">
    <label for="ece">ECE</label>
    <input type="checkbox" name="civil" id="civil">
    <label for="civil">Civil</label>
    <input type="checkbox" name="mesh" id="mesh">
    <label for="mesh">Mesh</label> <br>

    <label for="course">Course: </label>
    <select name="course" id="course">
    <option value="a">A</option>
    <option value="b">B</option>
    <option value="c">C</option>
    <option value="d">D</option>
    </select> <br>

    <label for="file">Student photo: </label>
    <input type="file" name="file" id="file"> <br>

    <label for="city">City: </label>
    <input type="text" id="city"> <br>

    <textarea name="add" id="add">Adresa: </textarea> <br>

    <input type="submit" value="Register">
</body>
</html>
